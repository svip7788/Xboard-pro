  <body>
    <div id="root"></div>
    <script>
      // 拦截 javascript: 协议链接点击，强制执行跳转
      document.addEventListener('click', function(e) {
        var a = e.target.closest('a[href^="javascript:window.location.href"]');
        if (a) {
          e.preventDefault();
          e.stopPropagation();
          var href = a.getAttribute('href');
          var url = href.match(/window\.location\.href='([^']+)'/);
          if (url && url[1]) window.location.href = url[1];
        }
      }, true);
    </script>
  </body>
